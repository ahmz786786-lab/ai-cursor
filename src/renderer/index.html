<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AI Cursor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Tiny bubble that follows the cursor -->
    <div id="bubble" class="bubble">
      <span class="pulse"></span>
      <span class="emoji">✨</span>
    </div>

    <!-- Expanded chat panel -->
    <div id="panel" class="card hidden">
      <header>
        <div class="title"><span class="dot"></span> AI Cursor</div>
        <div class="header-controls">
          <select id="provider">
            <option value="claude">Claude</option>
            <option value="gemini">Gemini</option>
          </select>
          <button id="closeBtn" title="Collapse">✕</button>
        </div>
      </header>

      <div id="messages" class="messages"></div>

      <form id="form" class="input-row">
        <button type="button" id="mic" title="Voice">🎤</button>
        <input id="input" type="text" placeholder="Ask anything…" autocomplete="off" />
        <button type="submit" id="send">↑</button>
      </form>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
